name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  dist:
    name: Release (cargo-dist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate dist manifest
        id: manifest
        uses: cargo-dist/action@main
        with:
          install-cargo-dist: true
          dist-dir: dist

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename sbom.json
          mkdir -p dist
          mv sbom.json.json dist/sbom.json
          sha256sum dist/sbom.json > dist/sbom.json.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: dist/artifacts/*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: ${{ steps.manifest.outputs.release-tag != '' }}
        with:
          tag_name: ${{ steps.manifest.outputs.release-tag }}
          files: |
            dist/artifacts/*
            dist/sbom.json
            dist/sbom.json.sha256

  publish:
    name: Publish to crates.io
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
        if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') }}
