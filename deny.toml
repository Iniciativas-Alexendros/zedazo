# cargo-deny configuration for Zedazo
# Ver ADR-0013 (propuesta) en DECISIONS.md

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = []
allow = [
    { name = "proc-macro2", reason = "común en derive macros" },
    { name = "unicode-ident", reason = "común en proc-macros" },
    { name = "syn", reason = "parser Rust, múltiples versiones inevitables" },
    { name = "quote", reason = "codegen, múltiples versiones inevitables" },
    { name = "smallvec", reason = "optimización común" },
    { name = "aho-corasick", reason = "regex dependency" },
    { name = "regex", reason = "clasificación" },
    { name = "regex-automata", reason = "regex dependency" },
    { name = "regex-syntax", reason = "regex dependency" },
    { name = "memchr", reason = "string search" },
    { name = "unicode-ident", reason = "proc-macro dependency" },
    { name = "thiserror", reason = "error handling" },
    { name = "thiserror-impl", reason = "thiserror dependency" },
    { name = "anyhow", reason = "error handling" },
    { name = "serde", reason = "serialization" },
    { name = "serde_core", reason = "serde dependency" },
    { name = "serde_derive", reason = "serde dependency" },
    { name = "serde_json", reason = "JSON export" },
    { name = "serde_spanned", reason = "toml dependency" },
    { name = "toml", reason = "config parsing" },
    { name = "toml_datetime", reason = "toml dependency" },
    { name = "toml_parser", reason = "toml dependency" },
    { name = "toml_writer", reason = "toml dependency" },
